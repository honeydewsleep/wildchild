; Pillow Blower Counter - firmware for the ESP32 "Cheap Yellow Display"
; (ESP32-2432S028R, 2.8" ILI9341 320x240 + XPT2046 resistive touch).
;
;   pio run -e cyd -t upload      ; flash over USB
;   pio device monitor -b 115200  ; serial log
;
; Copy include/config.h.example -> include/config.h and fill in WiFi +
; the Apps Script web-app URL before building.

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@7.1.0
    https://github.com/tzapu/WiFiManager.git#v2.0.17
build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; ---- TFT_eSPI wiring for the CYD (replaces User_Setup.h) ----
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

; Original CYD: ILI9341 panel, micro-USB.
[env:cyd]
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER=1

; Newer "2 USB" / USB-C CYD boards ship an ST7789 panel that needs
; colour inversion. If the screen shows inverted colours, flash this env.
[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_INVERSION_ON=1
